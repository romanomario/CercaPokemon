<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battaglia Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Rubik&display=swap" rel="stylesheet"/>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Battaglia Pokemon</h1>
        <form id="battleForm" class="p-4 border rounded">
            <div class="row">
                <!-- Colonna Giocatore 1 -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="player1" class="form-label">Nome del Giocatore 1</label>
                        <input type="text" id="player1" name="player1" class="form-control" placeholder="Inserisci il nome del Giocatore 1" required>
                    </div>
                </div>
                <!-- Colonna Giocatore 2 -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="player2" class="form-label">Nome del Giocatore 2</label>
                        <input type="text" id="player2" name="player2" class="form-control" placeholder="Inserisci il nome del Giocatore 2" required>
                    </div>
                </div>
            </div>
            <!-- Bottone centrale -->
            <div class="text-center mt-4">
                <button id="myButton" type="submit" class="btn btn-primary">Inizia</button>
            </div>
        </form>
    </div>
    
    <div id="pokemonSelectionContainer" class="d-none mt-4">
        <h2 class="text-center">Seleziona i tuoi Pokémon</h2>
        <div class="row">
            <!-- Selezione per Giocatore 1 -->
            <div class="col-md-6">
                <h4 id="player1Name">Giocatore 1</h4>
                <div id="player1Slots" class="d-flex flex-wrap"></div>
            </div>
            <!-- Selezione per Giocatore 2 -->
            <div class="col-md-6">
                <h4 id="player2Name">Giocatore 2</h4>
                <div id="player2Slots" class="d-flex flex-wrap"></div>
            </div>
        </div>
        <div id="pokemonListContainer" class="mt-4">
            <h4 class="text-center">Seleziona un Pokémon dalla lista</h4>
            <div id="pokemonList" class="d-flex flex-wrap"></div>
        </div>
        <div class="text-center mt-4">
            <button id="startBattle" class="btn btn-success d-none">Inizia la Battaglia</button>
        </div>
    </div>
    
    <div id="battleLog" class="mt-4"></div>
    <div id="results" class="mt-4"></div>
    <div id="battleArea" class="d-none">
        <div id="player1Pokemon" class="pokemon-battle"></div>
        <div id="player2Pokemon" class="pokemon-battle"></div>
        <p id="battleLog"></p>
    </div>
    
    
    <script src="/js/battle.js"></script>
</body>
</html>
